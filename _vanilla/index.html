<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opticab — See differently</title>
  <meta name="description" content="Frames for every you. Vision for a brighter tomorrow.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,900&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="hero" id="hero">
    <!-- Hero photo: sage sky + moss and flowers at assets/hero.webp.
         assets/hero-front.png is the moss + flowers cut out of that photo;
         it sits above the eyes so the hair tucks behind the foliage. -->
    <div class="hero__media" aria-hidden="true">
      <img class="hero__photo" src="assets/hero.webp" alt="" fetchpriority="high">
      <div class="hero__placeholder"></div>
      <div class="hero__moss"></div>
    </div>

    <header class="nav">
      <a class="nav__logo" href="#" aria-label="Opticab home">Opticab</a>
      <nav class="nav__links" aria-label="Primary">
        <a href="#">Eyeglasses</a>
        <a href="#">Sunglasses</a>
        <a href="#">Lenses</a>
        <a href="#">Our story</a>
      </nav>
      <div class="nav__actions">
        <button class="icon-btn" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        </button>
        <a class="nav__cart" href="#">Cart (<span id="cart-count">0</span>)</a>
        <a class="btn btn--light" href="#">Book eye test</a>
        <button class="icon-btn nav__menu" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
        </button>
      </div>
    </header>

    <h1 class="headline">
      <span class="headline__word headline__word--see" data-split>See</span>
      <span class="headline__word headline__word--diff" data-split>Differently</span>
    </h1>

    <!-- Eyes sit above the headline (hair strands cross the letters), glasses above the eyes.
         The frame is a live preview of the picker selection. -->
    <div class="hero__glasses" aria-hidden="true">
      <img class="hero__eyes" src="assets/eyes.webp" alt="" fetchpriority="high">
      <div class="hero__frame" id="hero-glasses"></div>
    </div>

    <img class="hero__front" src="assets/hero-front.png" alt="" aria-hidden="true">

    <div class="pitch">
      <p>Frames for every you.<br>Vision for a brighter tomorrow.</p>
      <a class="round-btn" href="#" aria-label="Shop frames">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
      </a>
    </div>

    <section class="picker" aria-label="Explore frames">
      <a class="picker__link" href="#">Explore frames</a>
      <div class="picker__frames" role="radiogroup" aria-label="Frame style" id="frames"></div>
      <span class="picker__divider" aria-hidden="true"></span>
      <div class="picker__swatches" role="radiogroup" aria-label="Frame colour" id="swatches"></div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
